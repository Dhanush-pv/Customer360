[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer360-governed-platform"
version = "0.1.0"
description = "Customer360 governed data platform — Week 1 foundation"
license = {text = "MIT"}
authors = [{name = "Dhanush"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[project.scripts]
customer360 = "customer360.cli:main"

[tool.setuptools.packages.find]
include = ["customer360*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]
